[package]
name = "tt-crypto"
description = "Signal-protocol encryption (X3DH + Double Ratchet) for DMs, pluggable group encryption for channels."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sender-keys"]
sender-keys = []
# MLS (RFC 9420) via openmls. Off until the relay provides a single commit order.
mls = []

[dependencies]
tt-core.workspace = true
thiserror.workspace = true
serde.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
rand_core.workspace = true
zeroize.workspace = true
